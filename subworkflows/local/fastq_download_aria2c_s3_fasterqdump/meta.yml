# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: fastq_download_aria2c_s3_fasterqdump
description: Download SRA archives from the NCBI Open Data Program with aria2c and convert them to FASTQ.
keywords:
  - SRA
  - NCBI
  - S3
  - aria2c
  - fastq
  - fasterq-dump
components:
  - custom/sratoolsncbisettings
  - sra/fastq/aria2c/s3
  - sratools/fasterqdump
input:
  - meta:
      type: map
      description: >
        Groovy Map containing sample information e.g. [ id:'test', single_end:false ]

  - run_accession:
      type: string
      description: >
        SRA run identifier used to construct the Open Data Program object path.

  - certificate:
      type: file
      description: >
        Path to a JWT cart file used to access protected dbGAP data on SRA using the sra-toolkit

      pattern: "*.cart"

  - connections:
      type: integer
      description: >
        Number of aria2c connections per SRA archive download.
output:
  - meta:
      type: map
      description: >
        Groovy Map containing sample information e.g. [ id:'test', single_end:false ]

  - reads:
      type: file
      description: Extracted FASTQ file or files if the sequencing reads are paired-end.
      pattern: "*.fastq.gz"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@vieomics"
maintainers:
  - "@vieomics"
